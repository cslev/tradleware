services:
  ib-gateway:
    image: cslev/ibkr-docker:latest
    container_name: ib_gateway
    restart: unless-stopped
    ulimits:
      nofile: 10000
    env_file:
      - .env.ibkr
    environment:
      # What to start: 'gateway' (lighter) or 'tws' (full platform)
      GATEWAY_OR_TWS: gateway
      # Auto-restart after logoff (recommended for automated trading)
      TWOFA_TIMEOUT_ACTION: restart
      # Persist TWS settings across container restarts
      TWS_SETTINGS_PATH: /settings
    volumes:
      - ./tws-settings:/settings
    ports:
      # noVNC web browser access (no VNC client needed)
      - "6080:6080"
      # TWS API - automatically forwards correct port (4001/4002) to 8888
      - "8888:8888"
    networks:
      - tradleware-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8888"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  tradleware-network:
    external: true