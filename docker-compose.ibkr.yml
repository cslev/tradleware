services:
  ib-gateway:
    image: ghcr.io/extrange/ibkr:stable
    container_name: ib_gateway
    restart: unless-stopped
    ulimits:
      nofile: 10000
    environment:
      # IBKR Credentials - set these in your .env file
      USERNAME: ${IBKR_USERNAME}
      PASSWORD: ${IBKR_PASSWORD}
      
      # What to start: 'gateway' (lighter) or 'tws' (full platform)
      GATEWAY_OR_TWS: gateway
      
      # Trading mode: 'paper' for paper trading, 'live' for live trading
      IBC_TradingMode: ${IBKR_TRADING_MODE:-paper}
      
      # Read-only API mode (safer - no orders will be placed if 'yes')
      IBC_ReadOnlyApi: ${IBKR_READ_ONLY:-'no'}
      
      # Auto-restart after logoff (recommended for automated trading)
      TWOFA_TIMEOUT_ACTION: restart
    ports:
      # noVNC web browser access (no VNC client needed)
      - "6080:6080"
      # TWS API - automatically forwards correct port (4001/4002) to 8888
      - "8888:8888"
    networks:
      - tradleware-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8888"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  tradleware-network:
    driver: bridge