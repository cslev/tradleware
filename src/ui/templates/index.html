<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="/static/css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased">
    <div class="container mx-auto p-4 max-w-2xl mt-10 bg-white shadow-lg rounded-lg">
        <h1 class="text-4xl font-bold text-blue-600 mb-6 text-center">TradleWare Dashboard</h1>
        <p class="text-lg text-center mb-8">{{ message }}</p>

        <div class="bg-blue-50 border-l-4 border-blue-500 text-blue-700 p-4" role="alert">
            <p class="font-bold">UI Under Construction!</p>
            <p>This is where your bot listings and details will go.</p>
        </div>

        <h2 class="text-2xl font-semibold mt-8 mb-4">Configured Trading Bots</h2>
        <div id="bot-list" class="space-y-4">
            <div class="bg-gray-50 p-4 rounded-md shadow-sm border border-gray-200 flex justify-between items-center">
                <span class="text-lg font-medium">My Awesome Bot (OKX)</span>
                <button class="text-gray-500 hover:text-gray-700 focus:outline-none">
                    <svg class="w-5 h-5 transform rotate-90 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
            </div>
        </div>

        <p class="text-sm text-center text-gray-500 mt-10">Listening for webhooks on /webhook</p>
    </div>
</body>
</html>
