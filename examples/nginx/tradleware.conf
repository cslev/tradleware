#####################################################
###                  TRADLEWARE                   ###
#####################################################
#
# Example nginx reverse-proxy config for Tradleware, as a drop-in under conf.d/.
# Replace tw.YOUR_DOMAIN.com and the upstream IP with your own.
#
# This file assumes the surrounding setup described here:
#   https://medium.com/codex/part-16-how-i-run-my-entire-digital-life-on-a-raspberry-pi-
#   true-remote-access-freedom-via-nginx-1a222a489ad5
#
# It expects three things to already exist:
#   /etc/nginx/ssl_YOUR_DOMAIN.conf   common TLS settings (certs, protocols, ciphers)
#   /etc/nginx/proxy.conf             common proxy headers — SEE THE NOTE BELOW
#   limit_req_zone ... zone=tradleware declared in the http{} block of nginx.conf —
#                                     see requirement 5 below. It must be its OWN
#                                     zone, not one shared with your other sites.
#
# -------------------------------------------------------------------------------------
# TRADLEWARE-SPECIFIC REQUIREMENTS — read these, two of them fail silently
# -------------------------------------------------------------------------------------
#
# 1. X-Forwarded-Proto is MANDATORY. Tradleware does not terminate TLS, so this header is
#    the only way it can know the client used HTTPS. Without it every webhook is refused
#    with 403 and nobody can sign in to the dashboard. It is set explicitly in the server
#    block below rather than left to your shared proxy.conf, so this example works as-is.
#
# 2. Set TRUSTED_PROXIES in Tradleware's .env to the address nginx connects FROM, or the
#    headers above are ignored on purpose and you get the same 403s. It is not the nginx
#    container's own IP as you see it — it is the source address Tradleware observes.
#    The dashboard footer shows exactly that address; use it, or its subnet:
#
#      TRUSTED_PROXIES=172.18.0.0/16
#
# 3. proxy_read_timeout must exceed TRADER_LOCK_TIMEOUT_S (default 60s). Tradleware runs
#    one operation per bot at a time, so a signal can legitimately wait that long before
#    it even starts executing. At nginx's default 60s you would get a 504 while the order
#    is still being placed — the worst outcome, since the trade may still go through.
#
# 4. No WebSocket support is needed. The dashboard polls over plain HTTP, so there is no
#    Upgrade/Connection handling here on purpose.
#
# 5. Give Tradleware its OWN limit_req zone, with a rate above its polling rate. The
#    dashboard refreshes the log panel for every bot on a timer, so an open tab makes a
#    permanent trickle of about (bots / LOG_REFRESH_INTERVAL seconds) requests per
#    second — 0.6 r/s for three bots at the 5s default, roughly 2,200 an hour. Point
#    this at a zone whose rate is below that and the bucket drains until every request
#    is refused; a large burst only delays that by minutes. Raising the burst is the
#    wrong knob — raise the RATE. In your nginx.conf http{} block:
#
#      limit_req_zone $binary_remote_addr zone=tradleware:10m rate=5r/s;
#
#    5 r/s leaves about 8x headroom for three bots, absorbs page loads (CSS, JS and one
#    logo per bot also pass through this location) and several open tabs, and still
#    limits abuse. Scale it up for more bots or a shorter refresh interval.
#
# -------------------------------------------------------------------------------------

### REDIRECT ANYTHING ON PORT 80 --> 443
server {
    listen 80;
    server_name tw.YOUR_DOMAIN.com;
    return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name tw.YOUR_DOMAIN.com;

  # common ssl settings
  include /etc/nginx/ssl_YOUR_DOMAIN.conf;

  # ---- proxy settings, set at server level so every location inherits them ----
  #
  # These MUST reach Tradleware. X-Forwarded-Proto is the one that breaks everything if
  # missing: Tradleware does not terminate TLS, so without it every webhook is refused
  # with 403 and nobody can sign in — with nothing in the logs pointing at nginx.
  #
  # nginx gotcha: proxy_set_header is inherited by a location ONLY if that location
  # defines no proxy_set_header of its own. One such directive inside location{} discards
  # every header set here. That is why they live at server level and why the shared
  # proxy.conf is included here too, not inside the location below.
  include /etc/nginx/proxy.conf;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Must exceed TRADER_LOCK_TIMEOUT_S (default 60s) — see note 3 above
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  # Webhook payloads are a few hundred bytes and the dashboard uploads nothing.
  # Tradleware reads the whole request body into memory before validating it, so cap it
  # here — this is the only place it is bounded.
  client_max_body_size 16k;

  # Keep the dashboard out of search results even if the hostname leaks
  add_header X-Robots-Tag "noindex, nofollow" always;

  #####################################################################################
  # EVERYTHING — dashboard and webhook
  #
  # One location on purpose. The webhook path is deliberately unguessable and can be
  # rotated at any time; keeping nginx path-agnostic means WEBHOOK_PATH lives in exactly
  # one place (.env) and this file never needs editing when it changes.
  #
  # Tradleware already does the work a per-path rule would do here: it throttles failed
  # authentications per source address, refuses replayed and stale signals, and requires
  # TLS. A tighter nginx limit on the webhook would only risk dropping real alerts.
  #
  # The one case that would justify a separate webhook location is wanting the dashboard
  # reachable from your LAN only while the webhook stays public — add allow/deny here and
  # a `location = /<your webhook path>` alongside it. That names the path in nginx too,
  # so rotate it in both places or signals start failing with 403.
  #####################################################################################
  location / {
    # Covers both the dashboard and the webhook. Tradleware's own zone, never a shared
    # one — see requirement 5 above. The dashboard's log polling is a permanent trickle,
    # so the zone's RATE has to exceed it; if it does not, this burst drains and every
    # request starts failing a few minutes after a tab is opened.
    limit_req zone=tradleware burst=100 nodelay;


    # A fixed address, not a container name — no resolver needed and nothing to re-resolve
    # if the container restarts. Pin it on Tradleware's side so it cannot move: see the
    # ipam block in Tradleware's docker-compose.yml, then give the service a fixed address
    # on that network.
    #
    #   networks:
    #     tradleware-network:
    #       ipam:
    #         config:
    #           - subnet: 172.28.0.0/16
    #             gateway: 172.28.0.1
    #
    #   services:
    #     tradleware:
    #       networks:
    #         tradleware-network:
    #           ipv4_address: 172.28.0.10
    #
    # nginx must be attached to that same network. Whatever you pin here is also the
    # address Tradleware will see nginx connect from — put nginx's address, or the
    # subnet, in TRUSTED_PROXIES.
    proxy_pass http://172.28.0.10:8080;

    access_log on;
    access_log /var/log/nginx/access_tradleware.log;
    error_log  on;
    error_log  /var/log/nginx/error_tradleware.log;
  }

  location = /robots.txt {
    # 'alias' points directly to the file's path inside the container.
    alias /usr/share/nginx/html/robots.txt;
    allow all;          # Allow all access to the robots.txt file itself
    log_not_found off;  # Don't log 404s if the file is missing
    access_log off;     # Don't log every robots.txt access request
  }
}
