#####################################################
###                  TRADLEWARE                   ###
#####################################################
#
# Example nginx reverse-proxy config for Tradleware, as a drop-in under conf.d/.
# Replace tw.YOUR_DOMAIN.com and the resolver address with your own.
#
# This file assumes the surrounding setup described here:
#   https://medium.com/codex/part-16-how-i-run-my-entire-digital-life-on-a-raspberry-pi-
#   true-remote-access-freedom-via-nginx-1a222a489ad5
#
# It expects three things to already exist:
#   /etc/nginx/ssl_YOUR_DOMAIN.conf   common TLS settings (certs, protocols, ciphers)
#   /etc/nginx/proxy.conf             common proxy headers — SEE THE NOTE BELOW
#   limit_req_zone ... zone=mylimit   declared in the http{} block of nginx.conf
#
# -------------------------------------------------------------------------------------
# TRADLEWARE-SPECIFIC REQUIREMENTS — read these, two of them fail silently
# -------------------------------------------------------------------------------------
#
# 1. X-Forwarded-Proto is MANDATORY. Tradleware does not terminate TLS, so this header is
#    the only way it can know the client used HTTPS. Without it every webhook is refused
#    with 403 and nobody can sign in to the dashboard. Your proxy.conf must contain:
#
#      proxy_set_header Host              $host;
#      proxy_set_header X-Real-IP         $remote_addr;
#      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#      proxy_set_header X-Forwarded-Proto $scheme;      # <-- the critical one
#
# 2. Set TRUSTED_PROXIES in Tradleware's .env to the address nginx connects FROM, or the
#    headers above are ignored on purpose and you get the same 403s. It is not the nginx
#    container's own IP as you see it — it is the source address Tradleware observes.
#    The dashboard footer shows exactly that address; use it, or its subnet:
#
#      TRUSTED_PROXIES=172.18.0.0/16
#
# 3. proxy_read_timeout must exceed TRADER_LOCK_TIMEOUT_S (default 60s). Tradleware runs
#    one operation per bot at a time, so a signal can legitimately wait that long before
#    it even starts executing. At nginx's default 60s you would get a 504 while the order
#    is still being placed — the worst outcome, since the trade may still go through.
#
# 4. No WebSocket support is needed. The dashboard polls over plain HTTP, so there is no
#    Upgrade/Connection handling here on purpose.
#
# -------------------------------------------------------------------------------------

### REDIRECT ANYTHING ON PORT 80 --> 443
server {
    listen 80;
    server_name tw.YOUR_DOMAIN.com;
    return 301 https://$host$request_uri;
}

server {
  # Point this to your local DNS server IP
  resolver 10.10.0.53 valid=30s;
  # Docker service name of the Tradleware container, so resolution works on the shared network
  set $backend http://tradleware:8080;

  listen 443 ssl;
  http2 on;
  server_name tw.YOUR_DOMAIN.com;

  # common ssl settings
  include /etc/nginx/ssl_YOUR_DOMAIN.conf;

  # Webhook payloads are a few hundred bytes and the dashboard uploads nothing.
  # Tradleware reads the whole request body into memory before validating it, so cap it
  # here — this is the only place it is bounded.
  client_max_body_size 16k;

  # Keep the dashboard out of search results even if the hostname leaks
  add_header X-Robots-Tag "noindex, nofollow" always;

  #####################################################################################
  # DASHBOARD
  #
  # Optional but recommended: TradingView only needs the webhook path, so the dashboard
  # does not have to be reachable from the internet at all. Uncomment to restrict it to
  # your own network and leave only the webhook public.
  #
  #   allow 192.168.1.0/24;
  #   allow 10.0.0.0/8;
  #   deny all;
  #####################################################################################
  location / {
    # The dashboard polls /balance, /price and /logs for every bot on a timer
    # (LOG_REFRESH_INTERVAL_MS, default 5s), so an open tab with several bots makes a
    # steady trickle of requests. Keep the burst generous or you throttle your own UI.
    limit_req zone=mylimit burst=50 nodelay;

    include /etc/nginx/proxy.conf;
    proxy_pass $backend;

    # Must exceed TRADER_LOCK_TIMEOUT_S — see note 3 above
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    access_log on;
    access_log /var/log/nginx/access_tradleware.log;
    error_log  on;
    error_log  /var/log/nginx/error_tradleware.log;
  }

  #####################################################################################
  # WEBHOOK
  #
  # Must match WEBHOOK_PATH in Tradleware's .env exactly. Randomise it there
  # (pwgen -n 14 1) and mirror the value here.
  #
  # Kept as its own location so it stays public even when the dashboard above is
  # restricted to your LAN, and so a burst of simultaneous alerts is never throttled by
  # the dashboard's limit. Tradleware does its own per-source throttling of FAILED
  # authentications, so nginx does not need to be strict here — being strict only risks
  # dropping real signals.
  #####################################################################################
  location = /webhook-CHANGE_ME {
    limit_req zone=mylimit burst=200 nodelay;

    include /etc/nginx/proxy.conf;
    proxy_pass $backend;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    access_log /var/log/nginx/access_tradleware.log;
    error_log  /var/log/nginx/error_tradleware.log;
  }

  location = /robots.txt {
    # 'alias' points directly to the file's path inside the container.
    alias /usr/share/nginx/html/robots.txt;
    allow all;          # Allow all access to the robots.txt file itself
    log_not_found off;  # Don't log 404s if the file is missing
    access_log off;     # Don't log every robots.txt access request
  }
}
