services:
  tradleware:
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - "tradleware:latest"
      args:
        - BUILDKIT_INLINE_CACHE=1
      cache_from:
        - "tradleware:latest"
    image: tradleware:latest
    container_name: tradleware-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Override specific environment variables if needed
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      # Mount logs directory to persist logs
      - ./logs:/app/src/logs:rw
    user: "1000:1000"  # Match the tradleware user from Dockerfile
    networks:
      - tradleware-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 128M

networks:
  tradleware-network:
    driver: bridge

