services:
  tradleware:
    image: cslev/tradleware:latest  # also available as cslev/tradleware:v3.0.2
    container_name: tradleware
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Mount logs directory to persist logs
      - ./tradleware_data/logs:/app/src/logs:rw
      # Mount bot configs directory (contains per-exchange YAML files with API keys)
      - ./bot_configs:/app/bot_configs:ro
    user: "1000:1000"  # Match the tradleware user from Dockerfile
    networks:
      - tradleware-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 128M

networks:
  tradleware-network:
    name: tradleware-network
    driver: bridge

