services:
  tradleware:
    image: cslev/tradleware:latest  # also available as cslev/tradleware:v3.5.0b
    container_name: tradleware
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Mount logs directory to persist logs
      - ./tradleware_data/logs:/app/src/logs:rw
      # Mount bot configs directory (contains per-exchange YAML files with API keys)
      - ./bot_configs:/app/bot_configs:ro
    user: "1000:1000"  # Match the tradleware user from Dockerfile
    networks:
      - tradleware-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 128M

networks:
  tradleware-network:
    name: tradleware-network
    driver: bridge
    # --- Pin the subnet if you rely on TRUSTED_IPS or TRUSTED_PROXIES ---------------
    # Requests that reach Tradleware from the Docker host (a kiosk browser on the same
    # machine, Home Assistant embedding the dashboard, a reverse proxy in another
    # container) arrive from this network's *gateway* address, not from the container's
    # own IP. That gateway is what belongs in TRUSTED_IPS / TRUSTED_PROXIES in .env.
    #
    # Docker allocates these subnets dynamically, so the gateway can change whenever the
    # network is recreated or another Compose project claims the range first — and then
    # the address in .env silently stops matching. The symptom is the dashboard showing
    # the login page instead of auto-signing in, or webhooks being rejected as arriving
    # over plain HTTP. The dashboard footer always shows the address Tradleware actually
    # sees, which is the value to trust.
    #
    # Uncomment to fix it in place, then set TRUSTED_IPS=172.28.0.1 (the gateway) in
    # .env. If `docker-compose up` reports a pool overlap, the range is already taken —
    # pick another one inside 172.16.0.0/12 and update .env to match.
    # ipam:
    #   config:
    #     - subnet: 172.28.0.0/16
    #       gateway: 172.28.0.1

